<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#E9E7E2">
<title>정반합 — 직접 물어보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#E9E7E2;--raised:#F3F1ED;--sunk:#DFDCD5;--line:#CFCBC2;--ink:#1C1F26;--muted:#7A776F;
  --th:#3E5C76;--th-w:#DFE5EA;--an:#8C6239;--an-w:#EDE3D6;--graphite:#4A4F58;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#DAD7D0;color:var(--ink);overscroll-behavior-y:none;
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;letter-spacing:-.015em}
.serif{font-family:'Nanum Myeongjo',ui-serif,Georgia,serif;line-height:1.8;letter-spacing:-.01em}
#app{position:relative;max-width:420px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--paper);
  display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){body{padding:22px 0}
  #app{min-height:min(880px,calc(100vh - 44px));height:min(880px,calc(100vh - 44px));
    height:min(880px,calc(100dvh - 44px));border-radius:22px;border:1px solid var(--line)}}
button,textarea,input{font-family:inherit;letter-spacing:-.015em;touch-action:manipulation}
button{cursor:pointer;border:none;background:none;color:inherit}
button:disabled{opacity:.3}button:active:not(:disabled){transform:scale(.99)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
textarea,input[type=password]{font-family:'Nanum Myeongjo',serif;width:100%;resize:none;border:1px solid var(--line);
  background:var(--paper);border-radius:10px;padding:12px;font-size:16px;line-height:1.8;color:var(--ink)}
input[type=password]{font-family:ui-monospace,monospace;font-size:14px}
.hide{display:none!important}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px}
.bar{flex-shrink:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--sb))}
.top{flex-shrink:0;background:var(--paper);border-bottom:1px solid var(--line);padding:9px 16px}
.cta{width:100%;min-height:52px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:16px}
.alt{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);color:var(--ink);font-size:15px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.card{background:var(--raised);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:background .2s,opacity .2s}
.beam{transition:transform .4s cubic-bezier(.22,.9,.3,1)}
.sheet{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end}
.veil{position:absolute;inset:0;background:rgba(28,31,38,.45)}
.panel{position:relative;width:100%;max-height:88%;overflow-y:auto;background:var(--raised);
  border-radius:18px 18px 0 0;padding:20px 16px calc(20px + var(--sb));animation:up .26s ease}
@keyframes up{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px}
.fade{animation:fd .22s ease}@keyframes fd{from{opacity:.3}to{opacity:1}}
.dbg{font:11px/1.6 ui-monospace,Menlo,monospace;color:var(--muted);background:var(--sunk);
  border-radius:8px;padding:9px 11px;white-space:pre-wrap;word-break:break-all}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">

<!-- ════ 키 ════ -->
<section id="sk" class="scroll" style="padding-top:52px">
  <h1 class="serif" style="font-size:23px;line-height:1.5;margin:0">시작하기 전에</h1>
  <p style="font-size:14px;color:var(--muted);line-height:1.8;margin:10px 0 0">
    받으신 참여 코드를 입력해 주세요.</p>
  <input id="key" type="password" placeholder="참여 코드" autocomplete="off" style="margin-top:20px">
  <div class="card" style="margin-top:16px;padding:14px 15px">
    <p style="margin:0;font-size:13px;line-height:1.8;color:var(--muted)">
      질문은 저장되지 않습니다. 카드를 만드는 데만 쓰이고 사라집니다.<br><br>
      시제품이라 하루에 쓸 수 있는 횟수가 정해져 있습니다.</p>
  </div>
  <p id="kerr" class="hide" style="margin-top:14px;background:var(--an-w);border-radius:10px;padding:12px;font-size:13px"></p>
</section>
<div id="bk" class="bar"><button id="kgo" class="cta" disabled>확인</button></div>

<!-- ════ 입력 ════ -->
<section id="s0" class="scroll hide" style="padding-top:44px">
  <p style="font-size:12px;color:var(--muted);margin:0">직접 물어보기 · 시제품</p>
  <h1 class="serif" style="font-size:25px;line-height:1.45;margin:9px 0 0">무엇을 정하지<br>못하고 계십니까?</h1>
  <p style="font-size:14px;color:var(--muted);margin:8px 0 0">정리와 반론은 제가 합니다. 결정은 당신이 하십니다.</p>
  <textarea id="q" rows="6" style="margin-top:20px" placeholder="상황과 고민을 편하게 적어주세요.&#10;가벼운 것도, 무거운 것도 괜찮습니다."></textarea>
  <p style="font-size:14px;margin:20px 0 9px">어느 쪽으로 들여다볼까요?</p>
  <div id="lenses" style="display:flex;flex-direction:column;gap:7px"></div>
  <details style="margin-top:18px">
    <summary style="font-size:13px;color:var(--muted);padding:8px 0;cursor:pointer">사정을 덧붙이기</summary>
    <textarea id="ctx" rows="3" placeholder="예산, 마감, 함께 겪을 사람 같은 것들"></textarea>
  </details>
  <p id="err" class="hide" style="margin-top:16px;background:var(--an-w);border-radius:10px;padding:12px;font-size:13px"></p>
</section>
<div id="b0" class="bar hide"><button id="start" class="cta" disabled>카드 펼치기</button></div>

<!-- ════ 로딩 ════ -->
<section id="s1" class="scroll hide" style="padding-top:64px">
  <p id="loadq" class="serif" style="font-size:17px;color:var(--muted);margin:0"></p>
  <ol id="steps" style="list-style:none;padding:0;margin:28px 0 0"></ol>
  <p style="font-size:12px;color:var(--muted);margin-top:28px">모델이 응답 중입니다. 20초쯤 걸립니다.</p>
  <button class="alt" style="margin-top:18px" onclick="location.reload()">취소</button>
</section>

<!-- ════ 리딩 ════ -->
<div id="t2" class="top hide">
  <div style="display:flex;align-items:center;gap:11px">
    <svg viewBox="0 0 110 40" style="width:92px;height:36px;flex-shrink:0" role="img" aria-label="의사결정 저울">
      <path d="M55 20 L55 33" stroke="var(--graphite)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M44 35 L66 35" stroke="var(--graphite)" stroke-width="2.8" stroke-linecap="round"/>
      <g id="beam" class="beam" style="transform-origin:55px 20px">
        <line x1="12" y1="20" x2="98" y2="20" stroke="var(--graphite)" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="12" cy="20" r="7.5" fill="var(--th-w)" stroke="var(--th)" stroke-width="1.4"/>
        <text x="12" y="24" text-anchor="middle" font-size="9.5" fill="var(--th)" font-family="'Nanum Myeongjo',serif">正</text>
        <circle cx="98" cy="20" r="7.5" fill="var(--an-w)" stroke="var(--an)" stroke-width="1.4"/>
        <text x="98" y="24" text-anchor="middle" font-size="9.5" fill="var(--an)" font-family="'Nanum Myeongjo',serif">反</text>
      </g>
      <circle cx="55" cy="20" r="4" fill="var(--paper)" stroke="var(--graphite)" stroke-width="2.4"/>
    </svg>
    <div style="min-width:0"><p id="cap" style="margin:0;font-size:13px"></p>
      <p id="capsub" style="margin:1px 0 0;font-size:11px;color:var(--muted)"></p></div>
  </div>
</div>
<section id="s2" class="scroll hide" style="padding-top:14px">
  <p id="norm" style="font-size:12px;color:var(--muted);margin:0"></p>
  <p id="opening" class="serif" style="font-size:16px;margin:6px 0 0"></p>
  <p id="guide" style="font-size:12px;color:var(--muted);margin:8px 0 14px"></p>
  <div id="cards" style="display:flex;flex-direction:column;gap:10px"></div>
  <div id="extra" style="margin-top:20px"></div>
  <p id="closing" class="serif" style="text-align:center;font-size:14px;color:var(--muted);margin:22px 0 14px"></p>
  <details style="margin-bottom:18px"><summary style="font-size:12px;color:var(--muted);padding:6px 0;cursor:pointer">디버그</summary>
    <div id="dbg" class="dbg"></div></details>
</section>
<div id="b2" class="bar hide">
  <p id="gate" style="font-size:12px;color:var(--muted);margin:0 0 8px;text-align:center"></p>
  <button id="decide" class="cta" disabled>결단하기</button>
</div>

<!-- ════ 되묻기 / 범위 밖 ════ -->
<section id="s9" class="scroll hide" style="padding-top:64px">
  <p id="nineTitle" class="serif" style="font-size:19px;line-height:1.7;margin:0"></p>
  <div id="nineBody" style="margin-top:16px;display:flex;flex-direction:column;gap:10px"></div>
</section>
<div id="b9" class="bar hide"><button class="alt" onclick="location.reload()">다시 물어보기</button></div>

<!-- ════ 봉인 ════ -->
<section id="s3" class="scroll hide" style="padding-top:60px">
  <p id="lv" style="font-size:13px;color:var(--muted);margin:0"></p>
  <blockquote id="ls" class="serif" style="margin:14px 0 0;border-left:2px solid var(--ink);padding-left:14px;font-size:18px"></blockquote>
  <div id="ld" class="hide" style="margin-top:20px;background:var(--an-w);border-radius:12px;padding:14px;font-size:14px"></div>
  <p id="lc" style="font-size:14px;color:var(--muted);margin-top:22px"></p>
</section>
<div id="b3" class="bar hide"><button class="alt" onclick="location.reload()">새 질문</button></div>

<div id="sheet" class="sheet hide"><div class="veil" id="veil"></div><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   ⚠️ 이 파일의 시스템 프롬프트는 lib/dialectic/prompt.ts 의 복사본입니다.
   원본을 고치면 여기도 같이 고쳐야 합니다. 검증 결과가 어긋나면 이 지점을 먼저 보십시오.
   ═══════════════════════════════════════════════════════════ */

/* 프롬프트와 덱은 서버(넷리파이 함수)에 있습니다. */
let CODE="";


async function generate(question,lens,context,attempt){
  attempt=attempt||1;
  const res=await fetch("/.netlify/functions/read",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({question,lens,context,code:CODE})});
  const ct=res.headers.get("content-type")||"";
  if(!ct.includes("application/json")){
    // 생성이 길어져 Netlify 가 HTML 오류 페이지를 준 경우다. 한 번만 조용히 다시 시도한다.
    if(attempt<2)return generate(question,lens,context,attempt+1);
    throw new Error("생성이 제한 시간을 넘었습니다. 질문을 조금 짧게 줄여 다시 시도해 보십시오.");
  }
  const data=await res.json();
  if(res.status===504&&attempt<2)return generate(question,lens,context,attempt+1);
  if(!res.ok){
    const err=new Error(data.detail||data.error||("HTTP "+res.status));
    err.hint=data.hint;   // 서버가 내려준 진단을 화면까지 실어 나른다
    throw err;
  }
  return {R:data.reading,debug:data.debug};
}

/* ═════ 여기서부터 화면 — 서버판과 동일 ═════ */
const TAGS=[["struck","😬","뜨끔"],["relieved","😌","안심"],["known","😐","알던 것"],["irrelevant","🙄","빗나감"]];
const W={struck:1,relieved:.6,known:.25,irrelevant:0};
const LENSES=[["balanced","⚖️","균형잡힌","치우치지 않고 전체를 본다"],["business","💼","비즈니스","돈이 드나드는 구조를 본다"],
  ["frugal","💸","짠돌이","쓴 값어치를 끝까지 따진다"],["growth","🌱","개인 성장","시간과 역량의 값을 본다"]];
const HL={"1d":"내일","1w":"다음 주","1m":"1개월 뒤","3m":"3개월 뒤","6m":"6개월 뒤"};
const HORIZONS={light:["1d","1w"],medium:["1w","1m"],heavy:["1m","3m","6m"]};
const $=x=>document.getElementById(x);
const show=(...ids)=>["sk","bk","s0","b0","s1","t2","s2","b2","s9","b9","s3","b3"].forEach(k=>$(k).classList.toggle("hide",!ids.includes(k)));
let lens="balanced",R=null,st=[],verdict=null,horizons=[],stmt="",touched=false;

$("key").addEventListener("input",()=>$("kgo").disabled=$("key").value.trim().length<3);
$("kgo").onclick=()=>{CODE=$("key").value.trim();$("key").value="";show("s0","b0")};

$("lenses").innerHTML=LENSES.map(([k,ic,l,n])=>
  `<button class="chip" data-l="${k}" style="min-height:46px;border-radius:12px;text-align:left;padding:8px 14px">
     ${ic} ${l} <span style="font-size:12px;opacity:.7">· ${n}</span></button>`).join("");
const syncLens=()=>document.querySelectorAll("[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===lens));
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lens=b.dataset.l;syncLens()});
syncLens();
$("q").addEventListener("input",()=>$("start").disabled=$("q").value.trim().length<5);

const STEPS=["질문을 한 문장으로 정리하는 중","무게와 자리 배치를 고르는 중","덱에서 카드를 뽑는 중","두 얼굴을 쓰는 중"];
$("start").onclick=async()=>{
  const question=$("q").value.trim();$("err").classList.add("hide");
  show("s1");$("loadq").textContent=question;
  $("steps").innerHTML=STEPS.map(s=>`<li style="display:flex;align-items:center;gap:11px;margin-bottom:13px">
    <span class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--line);flex-shrink:0"></span>
    <span class="lbl" style="font-size:14px;color:var(--line)">${s}</span></li>`).join("");
  let k=0;const mark=()=>{document.querySelectorAll(".dot").forEach((d,n)=>d.style.background=n<=k?"var(--ink)":"var(--line)");
    document.querySelectorAll(".lbl").forEach((l,n)=>l.style.color=n===k?"var(--ink)":n<k?"var(--muted)":"var(--line)")};
  mark();const timer=setInterval(()=>{k=Math.min(k+1,STEPS.length-1);mark()},4200);
  try{
    const out=await generate(question,lens,$("ctx").value.trim()||null);
    clearInterval(timer);R=out.R;window.__debug=out.debug;
    if(R.mode!=="dialectic")return nine();
    boot();
  }catch(e){
    clearInterval(timer);show("s0","b0");$("err").classList.remove("hide");
    $("err").innerHTML="<b>카드를 펼치지 못했습니다</b><br><span style='font:12px/1.6 ui-monospace,monospace'>"
      +String(e.message).replace(/</g,"&lt;")+"</span>"
      +(e.hint?"<br><br><span style='font-size:12px'>"+String(e.hint).replace(/</g,"&lt;")+"</span>":"")
      +(/403|코드/.test(e.message)?"<br><br><span style='font-size:12px'>참여 코드를 다시 확인해 주세요.</span>":"");
  }
};

function nine(){
  show("s9","b9");
  if(R.mode==="clarify"){
    $("nineTitle").textContent="조금 더 좁혀야 카드를 펼칠 수 있습니다.";
    $("nineBody").innerHTML=(R.clarifying_questions||[]).map(q=>
      `<p class="card serif" style="margin:0;padding:14px 16px;font-size:16px">${q}</p>`).join("");
  }else{
    $("nineTitle").textContent="이 질문은 제가 펼칠 자리가 아닙니다.";
    $("nineBody").innerHTML=`<p class="card serif" style="margin:0;padding:14px 16px;font-size:15px">${R.notice||""}</p>`;
  }
}

const weight=()=>R.weight||"medium";
const isLight=()=>weight()==="light";
function boot(){
  st=R.cards.map(c=>({id:c.id,face:"u",u:null,r:null,flips:0,seen:false,risk:null,planB:""}));
  horizons=[...(HORIZONS[weight()]||HORIZONS.medium)];
  show("t2","s2","b2");
  $("norm").textContent=R.normalized_question;$("opening").textContent=R.opening;
  $("guide").textContent=isLight()?"카드를 탭하면 반대쪽 얼굴이 나옵니다":"카드를 탭해 뒤집고, 반응을 남기면 다음 장이 열립니다";
  $("closing").textContent=R.closing;$("dbg").textContent=JSON.stringify(window.__debug,null,1);
  render();
}
const unlocked=n=>isLight()||n===0||Boolean(st[n-1].u||st[n-1].r);
const live=s=>s.r&&s.r!=="irrelevant";
const dot=(s,f)=>{const on=s[f]&&s[f]!=="irrelevant";
  return `<span style="width:6px;height:6px;border-radius:50%;background:${on?(f==="u"?"var(--th)":"var(--an)"):"var(--line)"}"></span>`};

function render(){
  tilt();$("cards").innerHTML="";
  R.cards.forEach((c,n)=>{
    const s=st[n],open=unlocked(n),up=s.face==="u",t=up?"th":"an",d=up?c.upright:c.reversed;
    const weighed=s[s.face]&&s[s.face]!=="irrelevant";
    const el=document.createElement("article");el.className="card";
    el.style.background=weighed?`var(--${t}-w)`:"var(--raised)";el.style.opacity=open?"1":".38";
    if(!open){el.innerHTML=`<div style="padding:16px 15px">
      <span style="font-size:11px;color:var(--muted)">${c.position?.slot_label||""}</span>
      <p class="serif" style="margin:3px 0 0;font-size:16px;color:var(--muted)">앞 카드에 반응하면 열립니다</p></div>`;
      $("cards").appendChild(el);return}
    el.innerHTML=`
      <button data-flip="${n}" style="width:100%;text-align:left;padding:14px 15px 12px">
        <span style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
          <span style="min-width:0">
            <span style="display:block;font-size:11px;color:var(--${t})">${c.position?.slot_label||""}</span>
            <span class="serif" style="display:block;font-size:17px;color:var(--${t})">${c.arcana?.name||"카드"}${c.is_blindside?' <span style="font-size:11px;opacity:.7">· 맹점</span>':""}</span></span>
          <span style="display:flex;align-items:center;gap:6px;flex-shrink:0">${dot(s,"u")}${dot(s,"r")}
            <span class="serif" style="font-size:15px;color:var(--${t});margin-left:2px">${up?"正":"反"}</span></span></span>
        <span class="serif fade" style="display:block;margin-top:9px;font-size:15px">${d.body}</span>
        ${!up&&c.reversed?.surfaces_at?`<span style="display:block;margin-top:7px;font-size:12px;color:var(--muted)">드러나는 시점 — ${c.reversed.surfaces_at}</span>`:""}
      </button>
      <div style="display:flex;gap:5px;padding:0 15px 14px">
        ${TAGS.map(([k,ic,lb])=>{const on=s[s.face]===k;
          return `<button data-rx="${n}|${k}" aria-label="${lb}" title="${lb}" style="flex:1;min-height:42px;border-radius:10px;
            border:1px solid ${on?`var(--${t})`:"var(--line)"};background:${on?`var(--${t})`:"transparent"};font-size:17px">${ic}</button>`}).join("")}
      </div>
      ${live(s)&&weight()==="heavy"?risk(n,s):""}`;
    $("cards").appendChild(el);
  });
  $("cards").querySelectorAll("[data-flip]").forEach(b=>b.onclick=()=>{
    const s=st[+b.dataset.flip];if(s.face==="u")s.seen=true;s.face=s.face==="u"?"r":"u";render()});
  $("cards").querySelectorAll("[data-rx]").forEach(b=>b.onclick=()=>{
    const [n,k]=b.dataset.rx.split("|"),s=st[n];
    if(s[s.face]!==k)s.flips++;s[s.face]=s[s.face]===k?null:k;
    if(!live(s)){s.risk=null;s.planB=""}if(!touched)stmt="";render()});
  $("cards").querySelectorAll("[data-risk]").forEach(b=>b.onclick=()=>{
    const [n,a]=b.dataset.risk.split("|");
    if(a==="mitigate")return planSheet(+n);
    st[n].risk="accept";st[n].planB="";if(!touched)stmt="";render()});

  $("extra").innerHTML=(R.questions||[]).slice(0,isLight()?1:2).map(q=>
    `<div class="card" style="padding:15px;margin-bottom:10px">
       <p class="serif" style="margin:0;font-size:16px">${q.question}</p>
       <p style="margin:6px 0 0;font-size:12px;color:var(--muted)">${q.why_it_matters||""}</p>
       <textarea rows="2" placeholder="비워두셔도 됩니다" style="margin-top:10px"></textarea></div>`).join("")
    +((R.tensions||[]).length?`<details style="margin-top:6px"><summary style="font-size:13px;padding:10px 0;cursor:pointer">부딪히는 자리</summary>
       ${R.tensions.map(t=>`<p class="card serif" style="margin:0 0 8px;padding:13px 15px;font-size:15px">${t.statement}</p>`).join("")}</details>`:"");

  const need=isLight()?2:R.cards.length;
  const done=st.filter(s=>s.u||s.r).length;
  const un=weight()==="heavy"?st.filter(s=>live(s)&&!s.risk).length:0;
  $("gate").textContent=un?`처리하지 않은 리스크 ${un}가지`:done<need?`${need-done}장에 더 반응해 주세요`:"";
  $("gate").style.color=un?"var(--an)":"var(--muted)";
  $("decide").disabled=done<need||un>0;
}
function risk(n,s){const on=a=>s.risk===a?"background:var(--an);border-color:var(--an);color:var(--paper)":"";
  return `<div style="padding:13px 15px;border-top:1px dashed var(--line)">
    <p style="margin:0 0 9px;font-size:13px">이 리스크를 어떻게 하시겠습니까?</p>
    <div style="display:flex;gap:8px">
      <button class="chip" data-risk="${n}|accept" style="flex:1;${on("accept")}">그냥 감수</button>
      <button class="chip" data-risk="${n}|mitigate" style="flex:1;${on("mitigate")}">${s.planB?"보완책 수정":"보완책 쓰기"}</button></div>
    ${s.planB?`<blockquote class="serif" style="margin:11px 0 0;border-left:2px solid var(--an);background:var(--an-w);padding:9px 11px;font-size:14px">${s.planB}</blockquote>`:""}</div>`}

function tilt(){
  let up=0,rv=0,n=0;
  st.forEach(s=>{const d=1-Math.min(s.flips,5)/5*.3;
    const a=s.u?W[s.u]*d:0,b=s.r?W[s.r]*d:0;if(a||b){up+=a;rv+=b;n++}});
  const t=up+rv,v=t?(up-rv)/t:0,m=Math.abs(v),side=v>0?"정(正)":"반(反)";
  $("beam").style.transform=`rotate(${(v*16).toFixed(1)}deg)`;
  $("cap").textContent=!n?"아직 올라간 카드가 없습니다.":m<.12?"양쪽이 거의 같습니다."
    :m<.4?`${side} 쪽으로 조금 기울었습니다.`:m<.75?`${side} 쪽으로 기울었습니다.`:`${side} 쪽으로 많이 기울었습니다.`;
  $("capsub").textContent=`${R.cards.length}장 중 ${n}장 · ${weight()}`;
}

function planSheet(n){
  const c=R.cards[n];
  $("panel").innerHTML=`<div class="grab"></div>
    <p style="margin:0;font-size:12px;color:var(--muted)">${c.position?.slot_label||""}</p>
    <p class="serif" style="margin:2px 0 0;font-size:19px">${c.arcana?.name||""}</p>
    <blockquote class="serif" style="margin:13px 0 0;border-left:2px solid var(--an);padding-left:12px;font-size:14px">${c.reversed.body}</blockquote>
    <label style="display:block;margin:20px 0 8px;font-size:14px">이게 실제로 일어나면, 무엇을 하시겠습니까?</label>
    <textarea id="pb" rows="4" placeholder="내 문장으로 씁니다"></textarea>
    <button id="save" class="cta" style="margin-top:16px">보완책 저장</button>`;
  $("sheet").classList.remove("hide");$("veil").onclick=()=>$("sheet").classList.add("hide");
  $("pb").value=st[n].planB||"";$("pb").focus();
  $("save").onclick=()=>{const v=$("pb").value.trim();if(v.length<5)return;
    st[n].risk="mitigate";st[n].planB=v;if(!touched)stmt="";$("sheet").classList.add("hide");render()};
}

const RANK={struck:3,relieved:2,known:1};
function draft(){
  const best=st.filter(s=>s.u&&s.u!=="irrelevant").sort((a,b)=>RANK[b.u]-RANK[a.u])[0];
  const worst=st.filter(s=>s.r&&s.r!=="irrelevant").sort((a,b)=>RANK[b.r]-RANK[a.r])[0];
  const claim=(s,f)=>{const c=R.cards.find(x=>x.id===s.id);return (f==="u"?c.upright:c.reversed).claim||""};
  const pro=best?claim(best,"u"):"",con=worst?claim(worst,"r"):"";
  if(isLight()){
    if(verdict==="go")return [pro?`${pro}, 그걸로 한다.`:"한다.",con?`${con}은 감수한다.`:""].filter(Boolean).join(" ");
    if(verdict==="pivot")return [con?`${con}이 걸린다.`:"조금 걸린다.",pro?`${pro}이 남으면 그때 한다.`:"며칠 두고 본다."].filter(Boolean).join(" ");
    return [con?`${con}, 그래서 안 한다.`:"안 한다.",pro?`${pro}은 다음으로 미룬다.`:""].filter(Boolean).join(" ");
  }
  const acc=st.filter(s=>s.risk==="accept").map(s=>claim(s,"r"));
  const pl=st.filter(s=>s.risk==="mitigate"&&s.planB).map(s=>s.planB);
  const j=a=>a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+"와(과) "+a[a.length-1];
  const A=acc.length?j(acc):con,P=pl.length?`다만 ${j(pl)}.`:"";
  if(verdict==="go")return [pro?`나는 ${pro}을(를) 위해`:"나는",A?`${A}을(를) 감수하고 실행한다.`:"실행한다.",P].filter(Boolean).join(" ");
  if(verdict==="pivot")return [pro?`나는 ${pro}을(를) 원한다.`:"나는 이 방향을 원한다.",
    A?`다만 ${A}이(가) 정리되기 전까지는 움직이지 않는다.`:"다만 조건이 갖춰지기 전까지는 움직이지 않는다.",P].filter(Boolean).join(" ");
  return [A?`나는 ${A}을(를) 확인했기에 지금은 하지 않는다.`:"나는 지금은 하지 않는다.",pro?`${pro}은(는) 다른 방법으로 찾는다.`:""].filter(Boolean).join(" ");
}

$("decide").onclick=()=>{
  const V=isLight()?[["go","한다","지금 정한다"],["pivot","미뤄둔다","며칠 두고 본다"],["drop","안 한다","이번엔 넘긴다"]]
                   :[["go","실행한다","지금 움직인다"],["pivot","조건부로 한다","조건이 갖춰지면"],["drop","하지 않는다","이번엔 넘긴다"]];
  $("panel").innerHTML=`<div class="grab"></div>
    <h2 style="font-size:16px;font-weight:500;margin:0">어떻게 하시겠습니까?</h2>
    <div id="vd" style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
      ${V.map(([k,l,n])=>`<button class="chip" data-v="${k}" style="min-height:48px;border-radius:12px;text-align:left;padding:10px 14px">
        ${l} <span style="font-size:12px;opacity:.7">· ${n}</span></button>`).join("")}</div>
    <div id="drop" class="hide" style="margin-top:12px;border:1px solid var(--an);background:var(--an-w);border-radius:12px;padding:12px;font-size:13px"></div>
    <div id="more" class="hide">
      <h2 style="font-size:15px;font-weight:500;margin:20px 0 8px">내 결단문</h2>
      <textarea id="stt" rows="3" style="font-size:16px"></textarea>
      <h2 style="font-size:15px;font-weight:500;margin:18px 0 8px">언제 다시 물어볼까요?</h2>
      <div id="hz" style="display:flex;gap:8px;flex-wrap:wrap"></div></div>
    <button id="lock" class="cta" style="margin-top:20px" disabled>이걸로 정한다</button>`;
  $("sheet").classList.remove("hide");$("veil").onclick=()=>$("sheet").classList.add("hide");
  const opts=HORIZONS[weight()]||HORIZONS.medium;
  const sync=()=>{
    $("vd").querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===verdict));
    $("more").classList.toggle("hide",!verdict);
    if(verdict&&!touched){stmt=draft();$("stt").value=stmt}
    const def=st.filter(s=>s.risk);
    $("drop").classList.toggle("hide",verdict!=="drop"||!def.length);
    if(verdict==="drop"&&def.length)$("drop").innerHTML=`막아낸 리스크 ${def.length}가지<br>
      <span class="serif" style="color:var(--muted)">${def.map(s=>R.cards.find(c=>c.id===s.id).arcana?.name||"").join(" · ")}</span>`;
    $("hz").innerHTML=opts.map(k=>`<button class="chip ${horizons.includes(k)?"on":""}" data-h="${k}" style="flex:1;min-height:44px">${HL[k]}</button>`).join("");
    $("hz").querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{const h=b.dataset.h;
      horizons=horizons.includes(h)?horizons.filter(x=>x!==h):[...horizons,h];sync()});
    $("lock").disabled=!verdict||!horizons.length||!$("stt").value.trim();
  };
  $("vd").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{verdict=b.dataset.v;sync()});
  $("panel").addEventListener("input",e=>{if(e.target.id==="stt"){touched=true;stmt=e.target.value;sync()}});
  $("lock").onclick=()=>{
    $("sheet").classList.add("hide");show("s3","b3");
    $("lv").textContent=V.find(v=>v[0]===verdict)[1];$("ls").textContent=stmt;
    const def=st.filter(s=>s.risk);
    if(verdict==="drop"){$("ld").classList.remove("hide");
      $("ld").textContent=def.length?`막아낸 리스크 ${def.length}가지가 함께 기록되었습니다.`:"하지 않기로 한 것도 결정입니다."}
    $("lc").textContent=`${horizons.map(h=>HL[h]).join(" · ")}에 이 문장을 다시 보여드리겠습니다.`;
  };
  sync();
};
</script>
</body>
</html>
