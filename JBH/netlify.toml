# Netlify 설정
#
# publish 를 public 으로 분리했습니다.
# 함수 폴더가 게시 폴더 안에 있으면 함수 코드가 웹에 그대로 노출될 수 있습니다.

[build]
  publish = "public"
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"

# 동기 함수 기본 한도는 10초입니다.
# 유료 플랜에서는 아래 설정 + 지원팀 요청으로 26초까지 올릴 수 있습니다.
# 무료 플랜에서는 이 줄이 무시됩니다.
[functions."read"]
  timeout = 26
