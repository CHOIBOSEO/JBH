<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#E9E7E2">
<title>정반합 — 모바일 데모</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9E7E2; --raised:#F3F1ED; --sunk:#DFDCD5; --line:#CFCBC2;
  --ink:#1C1F26; --muted:#7A776F;
  --th:#3E5C76; --th-w:#DFE5EA;
  --an:#8C6239; --an-w:#EDE3D6;
  --graphite:#4A4F58;
  --tap:44px; --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#DAD7D0;color:var(--ink);overscroll-behavior-y:none;
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;letter-spacing:-.015em}
.serif{font-family:'Nanum Myeongjo',ui-serif,Georgia,serif;line-height:1.8;letter-spacing:-.01em}

/* 데스크톱에서는 기기 폭으로 가둔다 — 모바일 레이아웃을 그대로 본다 */
#app{position:relative;max-width:420px;min-height:100vh;min-height:100dvh;margin:0 auto;background:var(--paper);
  display:flex;flex-direction:column;overflow:hidden}
@media(min-width:520px){
  body{padding:24px 0}
  #app{min-height:min(860px,calc(100vh - 48px));height:min(860px,calc(100vh - 48px));height:min(860px,calc(100dvh - 48px));
    border-radius:22px;border:1px solid var(--line)}
}

button,textarea{font-family:inherit;letter-spacing:-.015em;touch-action:manipulation}
button{cursor:pointer;border:none;background:none;color:inherit}
button:disabled{opacity:.32}
button:active:not(:disabled){transform:scale(.985)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
textarea{font-family:'Nanum Myeongjo',serif;width:100%;resize:none;border:1px solid var(--line);
  background:var(--paper);border-radius:10px;padding:12px;font-size:16px;line-height:1.8;color:var(--ink)}
.hide{display:none!important}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px}
.bar{flex-shrink:0;background:var(--paper);border-top:1px solid var(--line);
  padding:10px 18px calc(10px + var(--sb))}
.top{flex-shrink:0;background:var(--paper);border-bottom:1px solid var(--line);padding:10px 18px}

.cta{width:100%;min-height:52px;border-radius:12px;background:var(--ink);color:var(--paper);font-size:16px}
.alt{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--line);color:var(--ink);font-size:15px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.card{background:var(--raised);border:1px solid var(--line);border-radius:14px}

/* 카드 — 탭/스와이프로 뒤집는다 */
#deck{position:relative;touch-action:pan-y}
#deck.flip{animation:fl .32s ease}
@keyframes fl{0%{transform:rotateY(0);opacity:1}45%{transform:rotateY(8deg);opacity:.35}100%{transform:rotateY(0);opacity:1}}

.face-dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.beam{transition:transform .4s cubic-bezier(.22,.9,.3,1)}
.sheet{position:absolute;inset:0;z-index:40;display:flex;align-items:flex-end}
.veil{position:absolute;inset:0;background:rgba(28,31,38,.45)}
.panel{position:relative;width:100%;max-height:88%;overflow-y:auto;background:var(--raised);
  border-radius:18px 18px 0 0;padding:20px 18px calc(20px + var(--sb));animation:up .26s ease}
@keyframes up{from{transform:translateY(16px);opacity:.5}to{transform:none;opacity:1}}
.grab{width:36px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<noscript>
<div style="max-width:420px;margin:0 auto;padding:56px 20px;background:#E9E7E2;min-height:100vh">
  <p style="font-family:'Nanum Myeongjo',serif;font-size:19px;line-height:1.8;margin:0">
    이 데모는 자바스크립트로 돕니다.</p>
  <p style="font-size:14px;color:#7A776F;line-height:1.8;margin:14px 0 0">
    지금 화면은 스크립트가 차단된 상태입니다. iPhone의 파일 앱에서 바로 열면
    미리보기(Quick Look)가 뜨는데, 여기서는 스크립트가 실행되지 않습니다.
    Safari에서 열어야 합니다.</p>
</div>
</noscript>
<div id="app">

<!-- ════ 0. 질문 ════ -->
<section id="s0" class="scroll" style="padding-top:52px">
  <p style="font-size:12px;color:var(--muted);margin:0">데모 · 저장되지 않습니다</p>
  <h1 class="serif" style="font-size:25px;line-height:1.45;margin:10px 0 0">무엇을 정하지<br>못하고 계십니까?</h1>
  <p style="font-size:14px;color:var(--muted);margin:8px 0 0">정리와 반론은 제가 합니다.<br>결정은 당신이 하십니다.</p>
  <div class="card" style="margin-top:24px;padding:18px">
    <p class="serif" style="margin:0;font-size:17px">퇴사를 하고 싶다.</p>
  </div>
  <p style="font-size:14px;margin:26px 0 10px">어느 쪽으로 들여다볼까요?</p>
  <div style="display:flex;flex-direction:column;gap:8px">
    <button class="chip on" style="min-height:var(--tap);border-radius:12px;text-align:left;padding:10px 14px">
      ⚖️ 균형잡힌 <span style="font-size:12px;opacity:.75">· 치우치지 않고 전체를 본다</span></button>
    <button class="chip" style="min-height:var(--tap);border-radius:12px;text-align:left;padding:10px 14px;color:var(--muted)" disabled>
      💼 비즈니스 <span style="font-size:12px">· 돈이 드나드는 구조를 본다</span></button>
  </div>
</section>
<div id="b0" class="bar">
  <button class="cta" onclick="go()">카드 펼치기</button>
  <p style="text-align:center;font-size:12px;color:var(--muted);margin:8px 0 0">저울은 당신이 기울입니다</p>
</div>

<!-- ════ 1. 로딩 ════ -->
<section id="s1" class="scroll hide" style="padding-top:64px">
  <p class="serif" style="font-size:17px;color:var(--muted);margin:0">퇴사를 하고 싶다.</p>
  <ol id="steps" style="list-style:none;padding:0;margin:30px 0 0"></ol>
</section>

<!-- ════ 2. 카드 공개 ════ -->
<div id="t2" class="top hide">
  <div id="pg" style="display:flex;gap:5px"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
    <p id="slot" style="margin:0;font-size:12px;color:var(--muted)"></p>
    <div style="display:flex;align-items:center;gap:7px">
      <span id="d1" class="face-dot"></span><span id="d2" class="face-dot"></span>
      <span id="sig" class="serif" style="font-size:15px;margin-left:3px"></span>
    </div>
  </div>
</div>
<section id="s2" class="scroll hide" style="padding-top:16px">
  <div id="deck">
    <div class="card" style="padding:20px 18px 22px">
      <p id="cname" class="serif" style="margin:0;font-size:21px"></p>
      <p id="cbody" class="serif" style="margin:14px 0 0;font-size:17px"></p>
      <p id="cwhen" style="margin:16px 0 0;padding-top:12px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)"></p>
    </div>
    <p id="flipHint" style="text-align:center;font-size:12px;color:var(--muted);margin:12px 0 0"></p>
  </div>
</section>
<div id="b2" class="bar hide">
  <p id="ask" style="font-size:13px;color:var(--muted);margin:0 0 8px;text-align:center"></p>
  <div id="rx" style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px"></div>
  <div style="display:flex;gap:8px;margin-top:10px">
    <button id="prev" class="alt" style="width:64px;min-height:48px">←</button>
    <button id="next" class="cta" style="min-height:48px"></button>
  </div>
</div>

<!-- ════ 3. 캔버스 ════ -->
<div id="t3" class="top hide" style="padding:8px 18px">
  <div style="display:flex;align-items:center;gap:12px">
    <svg viewBox="0 0 110 40" style="width:96px;height:38px;flex-shrink:0" role="img" aria-label="의사결정 저울">
      <path d="M55 20 L55 33" stroke="var(--graphite)" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M44 35 L66 35" stroke="var(--graphite)" stroke-width="2.8" stroke-linecap="round"/>
      <g id="beam" class="beam" style="transform-origin:55px 20px">
        <line x1="12" y1="20" x2="98" y2="20" stroke="var(--graphite)" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="12" cy="20" r="7.5" fill="var(--th-w)" stroke="var(--th)" stroke-width="1.4"/>
        <text x="12" y="24" text-anchor="middle" font-size="9.5" fill="var(--th)" font-family="'Nanum Myeongjo',serif">正</text>
        <circle cx="98" cy="20" r="7.5" fill="var(--an-w)" stroke="var(--an)" stroke-width="1.4"/>
        <text x="98" y="24" text-anchor="middle" font-size="9.5" fill="var(--an)" font-family="'Nanum Myeongjo',serif">反</text>
      </g>
      <circle cx="55" cy="20" r="4" fill="var(--paper)" stroke="var(--graphite)" stroke-width="2.4"/>
    </svg>
    <div style="min-width:0">
      <p id="cap" style="margin:0;font-size:13px"></p>
      <p id="capsub" style="margin:1px 0 0;font-size:11px;color:var(--muted)"></p>
    </div>
  </div>
</div>
<section id="s3" class="scroll hide" style="padding-top:16px">
  <p style="font-size:13px;color:var(--muted);margin:0">탭하면 카드가 펼쳐집니다</p>
  <div id="rows" style="margin-top:10px;display:flex;flex-direction:column;gap:8px"></div>

  <details style="margin-top:22px">
    <summary style="font-size:14px;padding:12px 0;cursor:pointer">부딪히는 자리</summary>
    <div id="tens" style="display:flex;flex-direction:column;gap:8px;padding-bottom:4px"></div>
  </details>
  <details style="border-top:1px solid var(--line)">
    <summary style="font-size:14px;padding:12px 0;cursor:pointer">제가 답할 수 없는 질문</summary>
    <div id="qs" style="display:flex;flex-direction:column;gap:10px;padding-bottom:4px"></div>
  </details>

  <p id="closing" class="serif" style="text-align:center;font-size:14px;color:var(--muted);margin:26px 0 20px"></p>
</section>
<div id="b3" class="bar hide">
  <p id="gate" style="font-size:12px;margin:0 0 8px;text-align:center"></p>
  <button id="toDecide" class="cta">결단하기</button>
</div>

<!-- ════ 4. 봉인 ════ -->
<section id="s4" class="scroll hide" style="padding-top:64px">
  <p id="lv" style="font-size:13px;color:var(--muted);margin:0"></p>
  <blockquote id="ls" class="serif" style="margin:14px 0 0;border-left:2px solid var(--ink);padding-left:14px;font-size:18px"></blockquote>
  <div id="ld" class="hide" style="margin-top:20px;background:var(--an-w);border-radius:12px;padding:14px;font-size:14px"></div>
  <p id="lc" style="font-size:14px;color:var(--muted);margin-top:24px"></p>
</section>
<div id="b4" class="bar hide"><button class="alt" onclick="location.reload()">처음부터 다시</button></div>

<!-- ════ 시트 ════ -->
<div id="sheet" class="sheet hide">
  <div class="veil" id="veil"></div>
  <div class="panel" id="panel" role="dialog" aria-modal="true"></div>
</div>

</div>
<script>
window.addEventListener("error",function(e){
  var b=document.createElement("div");
  b.style.cssText="position:fixed;left:0;right:0;bottom:0;z-index:999;background:#8C6239;color:#F3F1ED;"+
    "padding:14px 16px;font:13px/1.6 -apple-system,sans-serif;white-space:pre-wrap";
  b.textContent="스크립트 오류 — "+e.message+"\n"+(e.filename||"")+" : "+(e.lineno||"");
  document.body.appendChild(b);
});
/* ═════ 고정 리딩 ═════ */
const R={
 opening:"그만두고 싶다고만 쓰셨습니다. 어디로 갈지는 아직 한 글자도 없습니다.",
 closing:"카드는 여기까지입니다. 기울이는 건 당신 손입니다.",
 cards:[
  {id:"c1",slot:"하면 얻는 것",name:"유리 천장방",
   u:{body:"지금 자리에서 더 오를 데가 없다는 감각은, 뒤집어 보면 그만큼 올라왔다는 뜻입니다. 다음 단계를 스스로 설계할 수 있는 자리에 서 계십니다.",claim:"다음 단계를 직접 설계할 자유"},
   r:{body:"성장이 멈춘 게 자리 때문인지 방식 때문인지 구분되십니까. 자리를 옮겨도 일하는 방식이 그대로면, 새 회사에서 같은 천장을 만납니다.",claim:"자리를 옮겨도 따라오는 방식",when:"이직 후 1년차, 신입 티가 벗겨질 무렵"}},
  {id:"c2",slot:"하면 잃는 것",name:"불타는 다리",
   u:{body:"퇴로를 끊으면 실행 속도가 붙습니다. 주말에만 이력서를 고치는 사람과 전부를 건 사람의 속도는 다릅니다.",claim:"퇴로를 끊고 얻는 속도"},
   r:{body:"쌓아둔 연차와 그 안의 신뢰는 다시 안 쌓입니다. 돌아갈 자리가 없다는 건 조건이 나빠져도 협상할 수 없다는 뜻이기도 합니다.",claim:"돌아갈 자리가 없다는 조건",when:"퇴사 6개월차, 첫 오퍼 조건을 받아 들었을 때"}},
  {id:"c3",slot:"안 하면 얻는 것",name:"조용한 이자",
   u:{body:"남아 있으면 조용히 쌓이는 것들이 있습니다. 연차, 이 조직에서만 통하는 맥락, 당신이 어떤 사람인지 아는 사람들. 초반엔 티가 안 나다가 어느 지점에서 벌어집니다.",claim:"조용히 쌓이는 연차와 신뢰"},
   r:{body:"나쁜 것도 똑같이 복리로 쌓입니다. 지금 견딜 만한 소모가 3년 뒤에도 견딜 만한 소모는 아닙니다.",claim:"같은 속도로 쌓이는 소모",when:"3년쯤 뒤, 같은 문장을 또 쓰고 있을 때"}},
  {id:"c4",slot:"안 하면 잃지 않는 것",name:"빈 의자",blind:true,
   u:{body:"남아 있으면 주변 사람들이 겪지 않아도 되는 불확실성이 있습니다. 예측 가능한 월급은 당신만의 것이 아닙니다.",claim:"주변이 겪지 않을 불확실성"},
   r:{body:"이 결정의 결과를 함께 겪을 사람이 이 자리에 없습니다. 그 사람은 당신이 버티기를 원한다고, 물어서 확인하셨습니까, 아니면 그렇게 짐작하고 계십니까.",claim:"묻지 않고 대신 정한 안정",when:"퇴사를 통보하는 날, 혹은 참기로 한 다음 날 저녁"}}
 ],
 tensions:["퇴로를 끊어야 속도가 나는데, 그 퇴로가 바로 조용히 쌓여온 것들입니다.",
           "남는 쪽의 안정은 주변을 위한 것이라 하셨지만, 그 사람에게 물어본 적은 없습니다."],
 questions:[{q:"무엇이 달라지면 남으시겠습니까. 그 조건이 한 문장으로 나옵니까?",why:"나갈 이유만 있고 남을 조건이 없으면, 옮긴 곳에서도 같은 문장을 쓰게 됩니다."},
            {q:"통장에 몇 달치가 있으면 견디실 수 있습니까?",why:"한도가 없는 실행은 실행이 아니라 표류입니다."}]
};
const TAGS=[["struck","😬","뜨끔"],["relieved","😌","안심"],["known","😐","알던 것"],["irrelevant","🙄","빗나감"]];
const W={struck:1,relieved:.6,known:.25,irrelevant:0};
const st=R.cards.map(c=>({id:c.id,u:null,r:null,flips:0,seen:false,risk:null,planB:"",open:false}));
let i=0,face="u",verdict=null,horizons=["1m","3m","6m"],stmt="",touched=false;
const $=x=>document.getElementById(x);
const show=(...ids)=>["s0","b0","s1","t2","s2","b2","t3","s3","b3","s4","b4"]
  .forEach(k=>$(k).classList.toggle("hide",!ids.includes(k)));

/* ═════ 로딩 ═════ */
const STEPS=["질문을 한 문장으로 정리하는 중","자리 배치를 고르는 중","덱에서 카드를 뽑는 중","두 얼굴을 쓰는 중"];
function go(){
  show("s1");
  $("steps").innerHTML=STEPS.map(s=>`<li style="display:flex;align-items:center;gap:11px;margin-bottom:13px">
    <span class="dot" style="width:6px;height:6px;border-radius:50%;background:var(--line);flex-shrink:0"></span>
    <span class="lbl" style="font-size:14px;color:var(--line)">${s}</span></li>`).join("");
  let k=0;const mark=()=>{
    document.querySelectorAll(".dot").forEach((d,n)=>d.style.background=n<=k?"var(--ink)":"var(--line)");
    document.querySelectorAll(".lbl").forEach((l,n)=>l.style.color=n===k?"var(--ink)":n<k?"var(--muted)":"var(--line)")};
  mark();const t=setInterval(()=>{k++;if(k>=STEPS.length){clearInterval(t);show("t2","s2","b2");draw();return}mark()},700);
}

/* ═════ 공개 ═════ */
function draw(){
  const c=R.cards[i],s=st[i],up=face==="u",tone=up?"th":"an";
  $("slot").textContent=c.slot;
  $("sig").textContent=up?"正":"反";$("sig").style.color=`var(--${tone})`;
  $("d1").style.background=up?"var(--th)":"var(--line)";
  $("d2").style.background=up?(s.seen?"var(--line)":"var(--line)"):"var(--an)";
  $("cname").textContent=c.name;$("cname").style.color=`var(--${tone})`;
  $("cbody").textContent=up?c.u.body:c.r.body;
  $("cwhen").textContent=up?"":"드러나는 시점 — "+c.r.when;
  $("cwhen").style.display=up?"none":"block";
  $("deck").querySelector(".card").style.background=s[face]?`var(--${tone}-w)`:"var(--raised)";
  $("flipHint").textContent=s.seen?"탭하거나 밀어서 뒤집기":(up?"카드를 밀어 반(反)을 보십시오":"밀어서 정(正)으로");
  $("ask").textContent=`이 ${up?"정(正)":"반(反)"}, 어떻게 읽히나요?`;

  $("rx").innerHTML=TAGS.map(([k,ic,lb])=>{
    const on=s[face]===k;
    return `<button data-k="${k}" style="min-height:56px;border-radius:12px;border:1px solid ${on?`var(--${tone})`:"var(--line)"};
      background:${on?`var(--${tone})`:"transparent"};color:${on?"var(--paper)":"var(--ink)"};
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
      <span style="font-size:19px;line-height:1">${ic}</span>
      <span style="font-size:11px">${lb}</span></button>`}).join("");
  $("rx").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;if(s[face]!==k)s.flips++;s[face]=s[face]===k?null:k;draw()});

  const ok=s.seen&&(s.u||s.r);
  $("next").disabled=!ok;$("prev").disabled=i===0;
  $("next").textContent=!s.seen?"반대쪽을 보십시오":(ok?(i===R.cards.length-1?"저울로":"다음 카드"):"반응을 남겨주세요");
  $("pg").innerHTML=R.cards.map((_,n)=>{const d=st[n].u||st[n].r;
    return `<span style="height:3px;flex:1;border-radius:99px;background:${d?"var(--ink)":n===i?"var(--graphite)":"var(--line)"}"></span>`}).join("");
}
function flip(){if(face==="u")st[i].seen=true;face=face==="u"?"r":"u";
  const d=$("deck");d.classList.remove("flip");void d.offsetWidth;d.classList.add("flip");draw()}
let x0=null,swiped=false;
$("deck").addEventListener("pointerdown",e=>{x0=e.clientX;swiped=false});
$("deck").addEventListener("pointerup",e=>{
  if(x0!==null&&Math.abs(e.clientX-x0)>40){swiped=true;flip()}
  x0=null});
$("deck").addEventListener("click",()=>{if(swiped){swiped=false;return}flip()});
$("prev").onclick=()=>{if(i>0){i--;face="u";draw()}};
$("next").onclick=()=>{const last=R.cards.length-1;
  if(i===last)return canvas();
  if(i===last-1)return pause();
  i++;face="u";draw()};

function pause(){
  const n=st.filter(s=>s.u||s.r).length;
  openSheet(`<p class="serif" style="margin:0;font-size:18px;line-height:1.7">여기까지 ${n}장을 보셨습니다.<br>마음이 이미 정해졌나요?</p>
   <p style="margin:10px 0 0;font-size:13px;color:var(--muted)">정해졌다면 마지막 카드는 안 보셔도 됩니다.</p>
   <div style="display:grid;gap:8px;margin-top:20px">
     <button class="cta" id="pm">아직입니다. 마지막 카드를 봅니다</button>
     <button class="alt" id="ps">정해졌습니다. 저울로 갑니다</button></div>`,()=>{i++;face="u";draw()});
  $("pm").onclick=()=>{closeSheet();i++;face="u";draw()};
  $("ps").onclick=()=>{closeSheet();canvas()};
}

/* ═════ 저울 ═════ */
function tilt(){
  let up=0,rv=0,n=0;
  st.forEach(s=>{const d=1-Math.min(s.flips,5)/5*.3;
    const a=s.u?W[s.u]*d:0,b=s.r?W[s.r]*d:0;if(a||b){up+=a;rv+=b;n++}});
  const t=up+rv,v=t?(up-rv)/t:0,m=Math.abs(v),side=v>0?"정(正)":"반(反)";
  $("beam").style.transform=`rotate(${(v*16).toFixed(1)}deg)`;
  $("cap").textContent=!n?"아직 올라간 카드가 없습니다."
    :m<.12?"양쪽이 거의 같습니다.":m<.4?`${side} 쪽으로 조금 기울었습니다.`
    :m<.75?`${side} 쪽으로 기울었습니다.`:`${side} 쪽으로 많이 기울었습니다.`;
  $("capsub").textContent=`${R.cards.length}장 중 ${n}장`;
}

/* ═════ 캔버스 — 접힌 행이 기본 ═════ */
const live=s=>s.r&&s.r!=="irrelevant";
function canvas(){
  show("t3","s3","b3");$("s3").scrollTop=0;
  $("tens").innerHTML=R.tensions.map(t=>`<p class="card serif" style="margin:0;padding:13px 15px;font-size:15px">${t}</p>`).join("");
  $("qs").innerHTML=R.questions.map(q=>`<div class="card" style="padding:15px">
    <p class="serif" style="margin:0;font-size:16px">${q.q}</p>
    <p style="margin:6px 0 0;font-size:12px;color:var(--muted)">${q.why}</p>
    <textarea rows="2" placeholder="비워두셔도 됩니다" style="margin-top:10px"></textarea></div>`).join("");
  $("closing").textContent=R.closing;
  rows();
}
const badge=(s,f,t)=>{
  const v=s[f];const ic=v?TAGS.find(x=>x[0]===v)[1]:"·";
  const on=v&&v!=="irrelevant";
  return `<span style="display:inline-flex;align-items:center;gap:3px;min-height:26px;padding:0 9px;border-radius:999px;
    font-size:12px;border:1px solid ${on?`var(--${t})`:"var(--line)"};background:${on?`var(--${t}-w)`:"transparent"};
    color:${on?`var(--${t})`:"var(--muted)"}">${f==="u"?"正":"反"} ${ic}</span>`};

function rows(){
  tilt();
  $("rows").innerHTML="";
  R.cards.forEach((c,n)=>{
    const s=st[n],el=document.createElement("div");
    el.className="card";el.style.overflow="hidden";
    el.innerHTML=`<button data-row="${n}" style="width:100%;display:flex;align-items:center;gap:10px;padding:13px 15px;text-align:left">
        <span style="flex:1;min-width:0">
          <span style="display:block;font-size:11px;color:var(--muted)">${c.slot}</span>
          <span class="serif" style="display:block;font-size:16px">${c.name}</span></span>
        ${badge(s,"u","th")}${badge(s,"r","an")}
      </button>${s.open?expand(n,c,s):""}`;
    $("rows").appendChild(el);
  });
  $("rows").querySelectorAll("[data-row]").forEach(b=>b.onclick=()=>{const n=+b.dataset.row;st[n].open=!st[n].open;rows()});
  $("rows").querySelectorAll("[data-rx]").forEach(b=>b.onclick=()=>{
    const [n,f,k]=b.dataset.rx.split("|"),s=st[n];
    if(s[f]!==k)s.flips++;s[f]=s[f]===k?null:k;
    if(f==="r"&&!live(s)){s.risk=null;s.planB=""}
    if(!touched)stmt="";rows()});
  $("rows").querySelectorAll("[data-risk]").forEach(b=>b.onclick=()=>{
    const [n,a]=b.dataset.risk.split("|");
    if(a==="mitigate")return planSheet(+n);
    st[n].risk="accept";st[n].planB="";if(!touched)stmt="";rows()});

  const un=st.filter(s=>live(s)&&!s.risk).length;
  $("gate").textContent=un?`처리하지 않은 리스크 ${un}가지`:"";
  $("gate").style.color=un?"var(--an)":"var(--muted)";
  $("toDecide").disabled=un>0;
}
function expand(n,c,s){
  const fc=(f,d,t,sg)=>`<div style="padding:14px 15px;background:${s[f]&&s[f]!=="irrelevant"?`var(--${t}-w)`:"transparent"};border-top:1px solid var(--line)">
    <span class="serif" style="font-size:12px;color:var(--${t})">${sg}</span>
    <p class="serif" style="margin:5px 0 0;font-size:15px">${d.body}</p>
    ${d.when?`<p style="margin:7px 0 0;font-size:12px;color:var(--muted)">드러나는 시점 — ${d.when}</p>`:""}
    <div style="display:flex;gap:6px;margin-top:11px">${TAGS.map(([k,ic,lb])=>{
      const on=s[f]===k;
      return `<button data-rx="${n}|${f}|${k}" aria-label="${lb}" style="flex:1;min-height:40px;border-radius:10px;
        border:1px solid ${on?`var(--${t})`:"var(--line)"};background:${on?`var(--${t})`:"transparent"};font-size:17px">${ic}</button>`}).join("")}</div></div>`;
  let h=fc("u",c.u,"th","正")+fc("r",c.r,"an","反");
  if(live(s)){
    const on=a=>s.risk===a?"background:var(--an);border-color:var(--an);color:var(--paper)":"";
    h+=`<div style="padding:13px 15px;border-top:1px dashed var(--line)">
      <p style="margin:0 0 9px;font-size:13px">이 리스크를 어떻게 하시겠습니까?</p>
      <div style="display:flex;gap:8px">
        <button class="chip" data-risk="${n}|accept" style="flex:1;${on("accept")}">그냥 감수</button>
        <button class="chip" data-risk="${n}|mitigate" style="flex:1;${on("mitigate")}">${s.planB?"보완책 수정":"보완책 쓰기"}</button></div>
      ${s.planB?`<blockquote class="serif" style="margin:11px 0 0;border-left:2px solid var(--an);background:var(--an-w);padding:9px 11px;font-size:14px">${s.planB}</blockquote>`:""}</div>`;
  }
  return h;
}

/* ═════ 시트 ═════ */
function openSheet(html,onVeil){
  $("panel").innerHTML=`<div class="grab"></div>`+html;
  $("sheet").classList.remove("hide");
  $("veil").onclick=()=>{closeSheet();onVeil&&onVeil()};
}
const closeSheet=()=>$("sheet").classList.add("hide");

function planSheet(n){
  const c=R.cards[n];
  openSheet(`<p style="margin:0;font-size:12px;color:var(--muted)">${c.slot}</p>
    <p class="serif" style="margin:2px 0 0;font-size:19px">${c.name}</p>
    <blockquote class="serif" style="margin:13px 0 0;border-left:2px solid var(--an);padding-left:12px;font-size:14px">${c.r.body}</blockquote>
    <label style="display:block;margin:20px 0 8px;font-size:14px">이게 실제로 일어나면, 무엇을 하시겠습니까?</label>
    <textarea id="pb" rows="4" placeholder="내 문장으로 씁니다"></textarea>
    <button id="save" class="cta" style="margin-top:16px">보완책 저장</button>`);
  $("pb").value=st[n].planB||"";$("pb").focus();
  $("save").onclick=()=>{const v=$("pb").value.trim();if(v.length<5)return;
    st[n].risk="mitigate";st[n].planB=v;if(!touched)stmt="";closeSheet();rows()};
}

/* ═════ 결단 시트 ═════ */
const RANK={struck:3,relieved:2,known:1};
function draft(){
  const best=st.filter(s=>s.u&&s.u!=="irrelevant").sort((a,b)=>RANK[b.u]-RANK[a.u])[0];
  const drive=best?R.cards.find(c=>c.id===best.id).u.claim:"";
  const acc=st.filter(s=>s.risk==="accept").map(s=>R.cards.find(c=>c.id===s.id).r.claim);
  const pl=st.filter(s=>s.risk==="mitigate"&&s.planB).map(s=>s.planB);
  const j=a=>a.length<2?(a[0]||""):a.slice(0,-1).join(", ")+"와(과) "+a[a.length-1];
  const A=j(acc),P=pl.length?`다만 ${j(pl)}.`:"";
  if(verdict==="go")return [drive?`나는 ${drive}을(를) 위해`:"나는",A?`${A}을(를) 감수하고 실행한다.`:"실행한다.",P].filter(Boolean).join(" ");
  if(verdict==="pivot")return [drive?`나는 ${drive}을(를) 원한다.`:"나는 이 방향을 원한다.",
    A?`다만 ${A}이(가) 정리되기 전까지는 움직이지 않는다.`:"다만 조건이 갖춰지기 전까지는 움직이지 않는다.",P].filter(Boolean).join(" ");
  return [A?`나는 ${A}을(를) 확인했기에 지금은 하지 않는다.`:"나는 지금은 하지 않는다.",
    drive?`${drive}은(는) 다른 방법으로 찾는다.`:""].filter(Boolean).join(" ");
}
const VL={go:"실행한다",pivot:"조건부로 한다",drop:"하지 않는다"};
const HL={"1m":"1개월",'3m':"3개월","6m":"6개월"};
$("toDecide").onclick=()=>decide();

function decide(){
  const V=[["go","실행한다","지금 움직인다"],["pivot","조건부로 한다","조건이 갖춰지면"],["drop","하지 않는다","이번엔 넘긴다"]];
  openSheet(`<h2 style="font-size:16px;font-weight:500;margin:0">무엇으로 하시겠습니까?</h2>
    <div id="vd" style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
      ${V.map(([k,l,n])=>`<button class="chip" data-v="${k}" style="min-height:var(--tap);border-radius:12px;text-align:left;padding:10px 14px">
        ${l} <span style="font-size:12px;opacity:.7">· ${n}</span></button>`).join("")}</div>
    <div id="drop" class="hide" style="margin-top:12px;border:1px solid var(--an);background:var(--an-w);border-radius:12px;padding:12px;font-size:13px"></div>
    <div id="more" class="hide">
      <h2 style="font-size:15px;font-weight:500;margin:22px 0 8px">내 결단문</h2>
      <textarea id="st" rows="4" style="font-size:16px"></textarea>
      <h2 style="font-size:15px;font-weight:500;margin:20px 0 8px">언제 다시 꺼내볼까요?</h2>
      <div id="hz" style="display:flex;gap:8px"></div>
    </div>
    <button id="lock" class="cta" style="margin-top:22px" disabled>이 결정으로 잠근다</button>
    <p style="text-align:center;font-size:12px;color:var(--muted);margin:10px 0 0">잠근 뒤에는 고칠 수 없습니다.</p>`);
  const sync=()=>{
    $("vd").querySelectorAll("[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===verdict));
    $("more").classList.toggle("hide",!verdict);
    if(verdict&&!touched){stmt=draft();$("st").value=stmt}
    const def=st.filter(s=>s.risk);
    $("drop").classList.toggle("hide",verdict!=="drop"||!def.length);
    if(verdict==="drop"&&def.length)$("drop").innerHTML=`막아낸 리스크 ${def.length}가지<br>
      <span class="serif" style="color:var(--muted)">${def.map(s=>R.cards.find(c=>c.id===s.id).name).join(" · ")}</span>`;
    $("hz").innerHTML=Object.entries(HL).map(([k,l])=>
      `<button class="chip ${horizons.includes(k)?"on":""}" data-h="${k}" style="flex:1;min-height:var(--tap)">${l}</button>`).join("");
    $("hz").querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{const h=b.dataset.h;
      horizons=horizons.includes(h)?horizons.filter(x=>x!==h):[...horizons,h];sync()});
    $("lock").disabled=!verdict||!horizons.length||!$("st").value.trim();
  };
  $("vd").querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{verdict=b.dataset.v;sync()});
  $("panel").addEventListener("input",e=>{if(e.target.id==="st"){touched=true;stmt=e.target.value;sync()}});
  $("lock").onclick=()=>{
    closeSheet();show("s4","b4");
    $("lv").textContent=VL[verdict];$("ls").textContent=$("st")?stmt:stmt;
    const def=st.filter(s=>s.risk);
    if(verdict==="drop"&&def.length){$("ld").classList.remove("hide");
      $("ld").textContent=`막아낸 리스크 ${def.length}가지가 함께 기록되었습니다.`}
    $("lc").textContent=`${horizons.sort().map(h=>HL[h]).join(" · ")} 뒤에 이 문장을 다시 보여드리겠습니다.`;
  };
  sync();
}
</script>
</body>
</html>
